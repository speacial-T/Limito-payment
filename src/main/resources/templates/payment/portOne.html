<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" th:href="@{/favicon.png}" type="image/png"/>
    <link rel="stylesheet" th:href="@{/portOne.css}" type="text/css"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>포트원 결제연동 샘플</title>
    <script async defer src="https://cdn.portone.io/v2/browser-sdk.js"></script>
</head>
<body>
<div id="root">
    <dialog id="loadingDialog" open>
        <article aria-busy="true">결제 정보를 불러오는 중입니다.</article>
    </dialog>
    <main id="checkoutDialog" style="display: none">
        <form id="checkoutForm">
            <article>
                <div class="item">
                    <h3 id="itemSummaryHeader"></h3>
                    <ul id="itemList">
                    </ul>
                </div>
                <div class="price">
                    <label>총 구입 가격</label>
                    <span class="price-value" id="totalPriceValue"></span>
                </div>
            </article>
            <button id="checkoutButton" type="submit">결제</button>
        </form>
    </main>
    <dialog id="failDialog">
        <header>
            <h1>결제 실패</h1>
        </header>
        <p id="failMessage"></p>
        <button class="closeDialog" type="button">닫기</button>
    </dialog>
    <dialog id="successDialog">
        <header>
            <h1>결제 성공</h1>
        </header>
        <p>결제에 성공했습니다.</p>
        <button class="closeDialog" type="button">닫기</button>
    </dialog>
</div>
<script th:inline="javascript">
    const orderId = /*[[${orderId}]]*/ "";
    const itemSummary = '[[${itemSummary}]]';
    const itemsString = '[[${items}]]'; // JSON 문자열로 받음

    const items = JSON.parse(itemsString);
    const totalPrice = '[[${totalPrice}]]';
    const channelKey = /*[[${channelKey}]]*/ "";
    const storeId = /*[[${storeId}]]*/ "";
    console.log("channelKey :", channelKey);
    console.log("storeId :", storeId);
    const checkout = new Checkout(
        storeId,
        channelKey,
    )
    checkout.load()

    function Checkout(storeId, channelKey) {
        const orderData = {
            orderId: orderId,
            itemSummary: itemSummary,
            items: items,
            totalPrice: totalPrice,
        };

        this.load = async () => {
            const waitPortOne = new Promise((resolve) => {
                const polling = setInterval(() => {
                    if (window.PortOne != null) {
                        clearInterval(polling)
                        resolve()
                    }
                }, 50)
            })

            await Promise.all([waitPortOne])

            window.loadingDialog.open = false
            window.checkoutDialog.open = true
            await this.showCheckout()
        }

        this.showCheckout = async () => {
            document.getElementById('itemSummaryHeader').replaceChildren(orderData.itemSummary);

            // 상품 총 가격 표시
            document.getElementById('totalPriceValue').replaceChildren(`${orderData.totalPrice.toLocaleString()}원`);

            const itemListElement = document.getElementById('itemList');
            itemListElement.innerHTML = ''; // 기존 목록 초기화

            // 상품 목록을 동적으로 생성하여 표시
            orderData.items.forEach(item => {
                const li = document.createElement('li');
                const amountText = item.productPrice != null ? `${item.productPrice.toLocaleString()}원` : '가격 정보 없음';
                li.innerHTML = `
                    <div class="item-text">
                        <h5>${item.productName}</h5>
                        <p class="price-value">${amountText}</p>
                    </div>
                    <p>${item.quantity} 개</p>
                `;
                itemListElement.appendChild(li);
            });

            window.checkoutDialog.onsubmit = async (e) => {
                e.preventDefault()
                this.setWaitingPayment(true)
                const paymentId = randomId()
                console.log(paymentId);
                const paymentRequest = {
                    storeId,
                    channelKey,
                    paymentId,
                    orderName: orderData.itemSummary,
                    totalAmount: orderData.totalPrice,
                    currency: "KRW",
                    payMethod: "CARD",
                    customData: {
                        orderId: orderData.orderId,
                    },
                }
                // PortOne 결제 요청
                /*   const payment = await PortOne.requestPayment({
                       storeId,
                       channelKey,
                       paymentId,
                       orderName: orderData.itemSummary, // 상품 요약 사용
                       totalAmount: orderData.totalPrice, // 총 가격 사용
                       currency: "KRW",
                       payMethod: "CARD",
                       customData: {
                           orderId: orderData.orderId, // 주문 ID를 customData에 포함
                       },
                   }) */
                const payment = await PortOne.requestPayment(paymentRequest)

                if (payment.code != null) {
                    this.setWaitingPayment(false)
                    console.log(payment)
                    const orderId = orderData.orderId

                    fetch(`/api/v1/payments/pass/${orderId}/fail-log`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            paymentId: payment.paymentId,
                            paymentStatus: "IN_PROGRESS",
                            refundStatus: "NOT_REQUESTED",
                            pgTransactionId: payment.txId,
                            pgProvider: "TOSSPAYMENTS",
                            retryCount: 0,
                            failureReason: payment.pgMessage,
                            pgErrorCode: payment.code,
                            pgErrorMessage: payment.message,
                            apiEndpoint: window.location.href,
                            requestPayload: JSON.stringify(paymentRequest)
                        })
                    }).catch(error => {
                        console.error('결제 실패 로그 전송 실패', error)
                    })

                    this.openFailDialog(payment.message)
                    return
                }
                console.log(payment);
                const completeResponse = await fetch(`/api/v1/payments/pass/${payment.paymentId}/confirm`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        orderId: orderData.orderId,
                        paymentKey: payment.paymentId,
                        amount: payment.totalAmount,
                        confirmedAt: payment.confirmedAt,
                        requestPayload: JSON.stringify(paymentRequest),
                        responsePayload: JSON.stringify(payment)
                    }),
                })

                this.setWaitingPayment(false)

                if (completeResponse.ok) {
                    const paymentComplete = await completeResponse.json()
                    switch (paymentComplete.status) {
                        case "SUCCESS":
                            this.openSuccessDialog()
                            break
                        case "VIRTUAL_ACCOUNT_ISSUED":
                            this.openVirtualAccountDialog()
                            break
                    }
                } else {
                    this.openFailDialog(await completeResponse.text())
                }
            }

            for (const dialogButton of document.getElementsByClassName(
                "closeDialog",
            )) {
                dialogButton.onclick = () => {
                    dialogButton.closest('dialog').open = false
                }
            }
            window.checkoutDialog.style = ""
        }

        this.setWaitingPayment = (isWaiting) => {
            window.checkoutButton.setAttribute("aria-busy", isWaiting.toString())
            window.checkoutButton.disabled = isWaiting
        }
        this.openFailDialog = (message) => {
            window.failMessage.replaceChildren(message)
            window.failDialog.open = true
        }
        this.openSuccessDialog = () => {
            window.successDialog.open = true
        }
        this.openVirtualAccountDialog = () => {
            window.virtualAccountDialog.open = true
        }

        function randomId() {
            return [...crypto.getRandomValues(new Uint32Array(2))]
                .map((word) => word.toString(16).padStart(8, "0"))
                .join("")
        }
    }
</script>
    <style>
    @import url("https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/variable/pretendardvariable-dynamic-subset.min.css");

    :root {
        --slate-0: #fff;
        --slate-50: #f8fafc;
        --slate-100: #f1f5f9;
        --slate-200: #e2e8f0;
        --slate-600: #475569;
        --slate-800: #1e293b;
        --slate-900: #0f172a;
        --body-padding: 32px;
    }

    body {
        font-family: "Pretendard Variable",
        Pretendard,
        -apple-system,
        BlinkMacSystemFont,
        system-ui,
        Roboto,
        "Helvetica Neue",
        "Segoe UI",
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        "Malgun Gothic",
        "Apple Color Emoji",
        "Segoe UI Emoji",
        "Segoe UI Symbol",
        sans-serif;
        background: var(--slate-100);
        min-height: 100vh;
        box-sizing: border-box;
        padding: var(--body-padding);
        display: flex;
        flex-direction: row;
        justify-content: stretch;
        overflow: hidden;
    }

    #root {
        flex: 1;
    }

    main {
        display: block;
        height: 100%;
        margin: 0 auto;
        background: var(--slate-0);
        border-radius: 12px;
        padding: 24px;
        border: none;
        box-sizing: border-box;
        max-width: calc(576px - var(--body-padding));
    }

    form {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: 100%;
    }

    article {
        display: flex;
        flex-direction: column;
        gap: 26px;
    }

    .item {
        border-radius: 8px;
        padding: 12px;
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 24px;
        background: var(--slate-50);
    }

    .item-image {
        border-radius: 6px;
        padding: 12px;
        background: var(--slate-100);
    }

    .item-image img {
        width: 66px;
        height: 66px;
    }

    .item-text {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
    }

    .item-text h5 {
        font-weight: 500;
        font-size: 17px;
        letter-spacing: -0.8px;
        color: var(--slate-800);
        margin: 0;
        word-break: keep-all;
    }

    .item-text p {
        font-size: 18px;
        color: var(--slate-600);
        margin: 0;
    }

    .price {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        border-top: 1px solid var(--slate-200);
        padding-top: 16px;
        font-weight: 500;
        font-size: 18px;
        color: var(--slate-900);
    }

    .price label {
        font-size: 17px;
        color: var(--slate-600);
    }

    button {
        border-radius: 6px;
        padding: 12px 16px;
        background: #fc6b2d;
        font-weight: 600;
        font-size: 18px;
        color: #fff;
        border: none;
        cursor: pointer;
    }

    button:disabled {
        pointer-events: none;
        background: #d65a25;
    }

    button[type="button"] {
        align-self: flex-end;
    }

    dialog {
        position: absolute;
        top: 0;
        bottom: 0;
        background: var(--slate-0);
        border-radius: 12px;
        padding: 24px;
        border: none;
        box-sizing: border-box;
        max-width: calc(576px - var(--body-padding));
        box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1),
        0 8px 10px -6px rgb(0 0 0 / 0.1);
        flex-direction: column;
        gap: 24px;
    }

    dialog[open] {
        display: flex;
    }

    header h1 {
        font-size: 24px;
        font-weight: 500;
    }
</style>
</body>
</html>
